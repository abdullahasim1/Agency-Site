name: Auto-merge Keystatic edits

# Keystatic saves land on `edit/*` branches (main is branch-protected) and the
# panel offers a "Create pull request" button. This workflow:
#
#  1. Renames the branch to `<editor-username>/task/<name>` so every CMS save
#     is traceable to the developer who made it (e.g. abdullah/task/xyz).
#  2. Closes the panel's PR (its head ref name goes stale when the branch is
#     renamed — GitHub does not retarget it) and opens a fresh PR from the
#     renamed branch.
#  3. Merges that PR automatically (squash) and deletes the branch, so the
#     editor never has to touch GitHub.
#
# The fresh PR's `opened` event re-triggers this workflow with a head that is
# already `<user>/task/<name>`: those runs skip the rename and replace steps
# and go straight to merging. A `synchronize` event on the new PR after the
# merge is a no-op (already-merged guard).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  rename-and-merge:
    if: >
      startsWith(github.event.pull_request.head.ref, 'edit/') ||
      contains(github.event.pull_request.head.ref, '/task/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve final branch name
        id: branch
        env:
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$PR_HEAD" in
            edit/*) suffix="${PR_HEAD#edit/}"; echo "name=${PR_USER}/task/${suffix}" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=${PR_HEAD}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Rename branch to <editor>/task/<name>
        if: startsWith(github.event.pull_request.head.ref, 'edit/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          NEW_NAME: ${{ steps.branch.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          # A previous run may have left a stale ref with this name behind.
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${NEW_NAME}" >/dev/null 2>&1 || true
          echo "Renaming $PR_HEAD -> $NEW_NAME"
          gh api -X POST "repos/${REPO}/branches/${PR_HEAD}/rename" \
            -f new_name="$NEW_NAME" --jq .name
      - name: Replace PR on the renamed branch
        if: startsWith(github.event.pull_request.head.ref, 'edit/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          NEW_NAME: ${{ steps.branch.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          title="$(gh pr view "$PR_NUM" --json title --jq '.title')"
          body="$(gh pr view "$PR_NUM" --json body --jq '.body')"
          gh pr close "$PR_NUM" --comment "Branch renamed to ${NEW_NAME} — continuing as a new PR."
          new_url="$(gh pr create --head "$NEW_NAME" --base main --title "$title" --body "$body")"
          echo "Replaced with $new_url"
      - name: Merge PR
        if: contains(github.event.pull_request.head.ref, '/task/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          NEW_BRANCH: ${{ steps.branch.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          state="$(gh pr view "$PR_URL" --json state --jq '.state')"
          if [ "$state" = "MERGED" ]; then
            echo "PR already merged — nothing to do"
            exit 0
          fi
          for attempt in {1..10}; do
            if gh pr merge "$PR_URL" --squash 2>/dev/null; then
              echo "Merged $PR_URL"
              echo "Deleting merged branch $NEW_BRANCH"
              gh api -X DELETE "repos/${REPO}/git/refs/heads/${NEW_BRANCH}" || true
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "Could not merge $PR_URL (conflict or failed check?)" >&2
          exit 1