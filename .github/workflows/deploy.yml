name: Deploy

# Runs only after CI succeeds, so nothing ships unless lint, typecheck and
# build are all green. A push to main deploys to production; a pull request
# deploys a preview and comments the URL back on the PR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Vercel
    # Gate: only deploy when the CI run we are reacting to actually passed.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # CI ran against a specific commit; deploy that exact commit, not
          # whatever is newest on the branch.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Decide environment
        id: env
        run: |
          if [ "${{ github.event.workflow_run.event }}" = "push" ] && \
             [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # --- Production (push to main) ---
      - name: Deploy production
        if: steps.env.outputs.target == 'production'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # --- Preview (pull request) ---
      - name: Deploy preview
        id: preview
        if: steps.env.outputs.target == 'preview'
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL on the PR
        if: steps.env.outputs.target == 'preview' && github.event.workflow_run.pull_requests[0]
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.preview.outputs.url }}";
            const pr = context.payload.workflow_run.pull_requests[0].number;
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n▲ **Preview deployed:** ${url}\n\n_Commit ${context.payload.workflow_run.head_sha.slice(0, 7)} · updates on every push._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
