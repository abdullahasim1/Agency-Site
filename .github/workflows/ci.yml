name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so we don't waste minutes on
# outdated commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Next telemetry is noise in CI and slows the run slightly.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Cache Next's build cache keyed on the lockfile + source, so unchanged
      # source restores incrementally between runs.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{ts,tsx,css}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run build

  deploy:
    # Only merge-to-main deploys; PRs stop at the checks above.
    if: github.ref == 'refs/heads/main'
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Deploys the committed code through the Vercel CLI. This runs from
      # GitHub Actions rather than relying on Vercel's git webhook, which has
      # been dropping Keystatic push events. The token (VERCEL_TOKEN) is a
      # Vercel access token stored as a repository secret. The Hobby plan caps
      # deploys at 100/24h, so retry briefly in case the window just reset.
      - name: Deploy production
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Deploy attempt $attempt"
            if npx vercel --prod --yes --token "$VERCEL_TOKEN" --scope abdullahasim1s-projects; then
              echo "Deploy succeeded"
              exit 0
            fi
            echo "Deploy failed (attempt $attempt), retrying in 60s"
            sleep 60
          done
          echo "Could not deploy: Hobby plan deployment quota exhausted (100/24h) or Vercel unavailable." >&2
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
